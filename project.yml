name: MyMoneyAI
options:
  bundleIdPrefix: io.github.aravindmarri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MyMoneyAI:
    type: application
    platform: iOS
    sources:
      - path: MyMoneyAI
        excludes:
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aravindmarri.mymoneyai
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MyMoney AI"
        INFOPLIST_KEY_NSCameraUsageDescription: "MyMoney AI uses the camera to photograph receipts. Images stay on this iPhone."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "MyMoney AI uses Face ID to lock your financial data."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
  MyMoneyAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyMoneyAI/Tests
    dependencies:
      - target: MyMoneyAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aravindmarri.mymoneyai.tests
schemes:
  MyMoneyAI:
    build:
      targets:
        MyMoneyAI: all
    test:
      config: Debug
      targets:
        - MyMoneyAITests
